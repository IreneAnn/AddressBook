version: "3.9"
services:
  address-book-api:
    image: irene22/address-book-api:latest
    container_name: address-book-api
    ports:
      - "8080:8080"
    volumes:
      - addressbook-data:/app/data
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/addressbook.db"
      APPLICATIONINSIGHTS_CONNECTION_STRING: "InstrumentationKey=7e415b98-d8b0-4d26-b400-332e2e5ab251;IngestionEndpoint=https://newzealandnorth-0.in.applicationinsights.azure.com/;LiveEndpoint=https://newzealandnorth.livediagnostics.monitor.azure.com/;ApplicationId=fa5684d0-3cd5-4688-b886-c7618ed305f0"
    restart: unless-stopped

volumes:
  addressbook-data: